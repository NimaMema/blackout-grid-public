spring.application.name=blackout-api
server.port=8080
server.address=0.0.0.0
spring.datasource.url=${BLACKOUT_DB_URL:jdbc:h2:file:./data/blackout;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.task.scheduling.pool.size=4
spring.h2.console.enabled=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:blackout}
spring.rabbitmq.password=${RABBITMQ_PASS:local-lab-only}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=2000
spring.rabbitmq.requested-heartbeat=10
blackout.worker-url=${BLACKOUT_WORKER_URL:http://localhost:8081}
blackout.internal-token=${BLACKOUT_INTERNAL_TOKEN:local-development-only}
logging.level.org.springframework.amqp.rabbit.connection.CachingConnectionFactory=WARN
server.error.include-message=always
