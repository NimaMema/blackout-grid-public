spring.application.name=blackout-worker
server.port=8081
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:blackout}
spring.rabbitmq.password=${RABBITMQ_PASS:local-lab-only}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=2
spring.rabbitmq.connection-timeout=2000
blackout.api-url=${BLACKOUT_API_URL:http://localhost:8080}
blackout.internal-token=${BLACKOUT_INTERNAL_TOKEN:local-development-only}
