services:
  rabbit:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-blackout}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-local-lab-only}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: docker/Server.Dockerfile
      args:
        MODULE: api
    environment:
      RABBITMQ_HOST: rabbit
      BLACKOUT_WORKER_URL: http://worker:8081
      BLACKOUT_DB_URL: jdbc:h2:file:/app/data/blackout;DB_CLOSE_ON_EXIT=FALSE
      RABBITMQ_USER: ${RABBITMQ_USER:-blackout}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-local-lab-only}
      BLACKOUT_INTERNAL_TOKEN: ${BLACKOUT_INTERNAL_TOKEN:-local-development-only}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api-data:/app/data
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; exec 3<&-; exec 3>&-"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: docker/Server.Dockerfile
      args:
        MODULE: worker
    environment:
      RABBITMQ_HOST: rabbit
      BLACKOUT_API_URL: http://api:8080
      RABBITMQ_USER: ${RABBITMQ_USER:-blackout}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-local-lab-only}
      BLACKOUT_INTERNAL_TOKEN: ${BLACKOUT_INTERNAL_TOKEN:-local-development-only}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/Web.Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped
volumes:
  api-data:
  rabbit-data:
